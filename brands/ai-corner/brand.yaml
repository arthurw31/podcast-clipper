# ============================================================================
# AI Corner — le podcast d'AI Partners
# Charte : skill aip-brand-guidelines (Metropolis, bleu #258AF3, navy #151D53, jamais d'italique).
# Style de montage (depuis le 05/10/2026) : les shorts verticaux du monteur AI Partners
#   (references/dust/, preset `aip-short`) — barre de logos centrée (invité + AI PARTNERS),
#   titre-question dans une bulle blanche, sous-titres blancs mot à mot sous la bulle, écran partagé,
#   light leak aux raccords ; + carte de fin animée AI Partners de 2 s (logo + CTA centrés).
#   Ancien style LinkedIn 16:9 (references/*.mp4) : preset `editorial`.
# ============================================================================

name: "AI Corner (AI Partners)"
podcast_name: "AI Corner"
language: fr

montage:
  preset: aip-short          # style des shorts du monteur AI Partners (config/presets/aip-short.yaml)

formats: ["9x16"]            # shorts verticaux seulement (07/10/2026 : le 16:9 doublait build + rendu) ; 16:9 sur demande : --formats 9x16,16x9

selection:
  n_clips: 5                 # workflow : ~10 propositions (`propose`), 5 retenues (`pick`)
  min_duration: 25           # shorts du monteur : 16–38 s
  max_duration: 45
  target_duration: 34
  max_segments: 3            # accroche (souvent la question) + 1-2 passages qui y répondent
  # une passe LLM par angle, en parallèle, puis jury (voir defaults.yaml « angles »)
  angles:
    - "CAS D'USAGE CONCRET : un déploiement d'IA précis dans l'entreprise, avec son résultat, un chiffre ou un ordre de grandeur, ce qui a marché ou pas."
    - "POSITION TRANCHÉE / CONTRE-INTUITION : une conviction forte de l'invité sur l'IA (gouvernance, risque, souveraineté, vendeurs, coûts, ce que tout le monde fait mal), une question de Thomas qui pose un vrai dilemme."
    - "HUMAIN ET ORGANISATION : collaborateurs, clients, adoption, formation, ce que l'IA change dans le travail des équipes, leçon d'un échec ou d'un faux départ, conseil actionnable à un dirigeant."

transcribe:
  vocabulary: ["AI Partners", "AI Corner", "Thomas Spitz", "COMEX", "Copilot", "ChatGPT", "agentique", "LLM"]
  corrections:
    iPartners: "AI Partners"
    IPartners: "AI Partners"
    post-Lindin: "post LinkedIn"   # E22 (07/10/2026)
    Lindin: "LinkedIn"

colors:
  primary: "#258AF3"         # Blue Primaire — accents, CTA
  secondary: "#151D53"       # Navy Deep
  text: "#FFFFFF"
  background: "#000000"

fonts:
  family: "Metropolis"
  caption: "fonts/Metropolis-BoldItalic.ttf"      # jamais utilisé (italic: false) mais requis
  caption_upright: "fonts/Metropolis-Bold.ttf"
  display: "fonts/Metropolis-ExtraBold.ttf"
  captions_alt: "fonts/Arimo-VF.ttf"                # sous-titres des shorts : Arimo = Arial (mêmes mesures)
  hook: "fonts/FiraSansCondensed-Bold.ttf"        # bulle-titre des shorts (police condensée du monteur)

outro:
  enabled: true
  duration: 3.5              # animation de la charte accélérée ×2,9 (06/10/2026 : ×5 sur 2 s jugé trop rapide)
  background: video          # animation officielle AI Partners (lignes « montagne » qui se dessinent)
  video: "outro_anim.mov"    # 2800×1122, 10 s -> recadrée au format et accélérée pour durer `duration`
  video_focus_x: 0.62        # centre du recadrage vertical sur le motif
  scrim: "radial-gradient(ellipse 75% 32% at 50% 50%, rgba(0,0,0,.72) 0%, rgba(0,0,0,.35) 60%, rgba(0,0,0,0) 100%)"
  layout: center             # logo et CTA centrés sur l'animation (demande d'Arthur)
  logo_file: "logo.png"      # logo horizontal blanc
  logo_width: 0.66
  show_guest: false          # le monteur n'affiche pas l'invité ; passer à true pour l'ajouter
  guest_color: "#FFFFFF"
  company_color: "#258AF3"
  company_italic: false
  cta:                       # bouton bleu AI Partners, texte blanc (règle CTA de la charte)
    text: "▶  L'ÉPISODE COMPLET SUR AI CORNER"
    subtext: "Lien en bio"
    pill_text_color: "#FFFFFF"
    font_size: 34
    delay: 0.2               # carte de 2 s : le CTA arrive presque avec le logo

broll:
  enabled: false             # aucun B-roll dans les clips du monteur

publication:                 # posts LinkedIn en anglais, style de la page AI Partners (voir posts.md)
  language: en
  host_name: "Thomas Spitz"
  channels: "AI PARTNERS YouTube channel, Spotify, Ausha"

framing:
  wide_shot_mode: speaker
  speaker_fallback: split
  host_side: right           # Thomas (animateur) à droite, invité à gauche sur ce plateau
  slow_zoom: false           # le monteur ne zoome pas (punch-in par coupes)
  synthetic_cuts: true       # nécessaire en vertical pour suivre le locuteur sur les plans larges
  max_shot_len: 10          # le monteur tient ses plans : peu de coupes ajoutées (retour d'Arthur : « pas trop de cuts »)
  split_divider: 0           # pas de trait entre les deux images (shorts du monteur)

format_overrides:
  "16x9":
    logo:
      enabled: false         # le master 16:9 a déjà le logo AI PARTNERS incrusté en haut à droite
    captions:
      font_size: 46
      max_chars_per_line: 34
      max_lines: 2
      position_y: 0.80
    hook:
      font_size: 50
      max_width: 0.6
      position_y: 0.62
    guest_logo:
      height: 0.06
      margin: 0.035
    outro:
      logo_width: 0.34
      video_focus_x: 0.68
      cta:
        subtext: "Lien en description"
        font_size: 30

# Teaser d'ouverture de l'épisode complet (commande episode, 07/10/2026) — calqué sur E20 MAIF : ~50 s de phrases fortes
# sous-titrées, puis le logo AI Partners sur l'animation de la charte. Appliqué PAR-DESSUS la config ci-dessus.
teaser:
  # Framework : docs/TEASER_FRAMEWORK.md (modèle « Dans la tête d'un CEO », 08/10/2026) adapté à la charte AI Partners :
  # sous-titres ÉNORMES en capitales, Metropolis ExtraBold droite (jamais d'italique), blanc + mots-clés bleu #258AF3,
  # mot à mot avec 2e ligne décalée ; logo AI PARTNERS en haut à droite ; carte de fin floutée + invité + entreprise.
  formats: ["16x9"]
  fps: 24                    # = rushs et corps de l'épisode (concaténation sans réencodage)
  hook:
    enabled: false
  guest_logo:
    enabled: false
  fonts:
    caption_upright: "fonts/Metropolis-ExtraBold.ttf"
    captions_alt: ""         # pas d'Arimo ici : la police de la marque (Metropolis)
  captions:
    uppercase: true
    italic: false
    weight: 800
    font_family: ""
    line_height: 1.0
    letter_spacing: "0.01em"
    color: "#FFFFFF"
    highlight_color: "#258AF3"
    highlight_keywords: true
    keyword_pop: true
    text_shadow: "0 4px 0 rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.6)"
    stroke_width: 0
    align: left
    stagger_lines: true
    stagger_offset: 0.12
    reveal: typewriter
    entrance: slide-left
    reveal_reflow: false
    word_fade: 0
    dialogue_dashes: false
    max_words_per_group: 6
    min_group_duration: 0.5
  montage:
    join_transition: cut     # coupes sèches entre extraits (débit continu)
  outro:
    duration: 3.5
    background: blur-freeze  # dernière image floutée, comme les teasers de référence
    blur: 22
    darken: 0.25
    layout: center
    show_guest: true
    guest_color: "#FFFFFF"
    company_color: "#258AF3"
    company_italic: false
    cta:
      enabled: false
  format_overrides:
    "16x9":
      captions:
        font_size: 100       # ≈ 10 % de la hauteur par ligne, comme les références
        max_chars_per_line: 18
        max_lines: 2
        position_y: 0.56
        side_margin: 0.08
      logo:
        enabled: true
        mode: image
        position: top-right
        width: 0.20             # même réglage que l'épisode (E20 MAIF : ≈ 0,22)
        margin: 0.02
        opacity: 1.0
      outro:
        logo_width: 0.40
        guest_font_size: 76    # nom de l'invité bien lisible, comme les cartes de fin de référence
        company_font_size: 60

# Logo incrusté en haut à droite pendant tout l'épisode complet (retour d'Arthur, 07/10/2026 : « plus gros en haut à
# droite » — E20 l'avait, en tout petit). Fractions de la largeur de l'image ; même réglage que le teaser ci-dessus.
episode_logo:
  file: "logo.png"
  width: 0.20
  margin: 0.02

# Shorts depuis rushs multicam (retour d'Arthur, 07/10/2026 : « gros angle sur celui qui parle la plupart du temps, mais
# aussi de temps en temps l'angle avec les deux personnes pour montrer que l'autre écoute ») : écran partagé vertical
# (les deux caméras l'une sur l'autre) toutes les ~6,5–9,5 s, 2,4–3,2 s, pas avant la fin de l'accroche.
multicam:
  split_every: [6.5, 9.5]
  split_len: [2.4, 3.2]
  first_after: 11.5          # après l'accroche : la bulle-titre (7,5–11,5 s) cacherait le visage du bas
